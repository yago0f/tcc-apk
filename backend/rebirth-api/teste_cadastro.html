<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teste Cadastro Rebirth</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;background:#f5f7fb;color:#0c1d3a}
    form{display:grid;gap:12px;background:#fff;padding:24px;border-radius:18px;box-shadow:0 10px 30px #0001}
    input,button{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid #ccd5e5}
    button{background:#1166ee;color:#fff;border:0;font-weight:700;cursor:pointer}
    pre{white-space:pre-wrap;background:#09182d;color:#dce8ff;padding:18px;border-radius:14px;min-height:100px}
  </style>
</head>
<body>
  <h1>Teste direto do cadastrar.php</h1>
  <p>Este teste ignora o Expo. Se funcionar aqui, PHP + MySQL estao corretos e o problema restante esta no JavaScript da tela.</p>
  <form id="f">
    <input id="nome" placeholder="Nome completo" value="Usuario Teste" required />
    <input id="cpf" placeholder="CPF (11 numeros)" value="52998224725" required />
    <input id="nascimento" type="date" value="2007-05-29" required />
    <input id="telefone" placeholder="Telefone" value="(13) 99878-5678" required />
    <input id="email" type="email" placeholder="E-mail" required />
    <input id="senha" type="password" placeholder="Senha" value="123456" required />
    <button type="submit">Cadastrar diretamente</button>
  </form>
  <h2>Resposta</h2>
  <pre id="out">Aguardando...</pre>
<script>
const form=document.getElementById('f');
const out=document.getElementById('out');
document.getElementById('email').value=`teste${Date.now()}@rebirth.local`;
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  out.textContent='Enviando...';
  const payload={
    nome_usuario:document.getElementById('nome').value.trim(),
    cpf_usuario:document.getElementById('cpf').value.replace(/\D/g,''),
    data_nascimento:document.getElementById('nascimento').value,
    telefone_usuario:document.getElementById('telefone').value.trim(),
    email_usuario:document.getElementById('email').value.trim().toLowerCase(),
    senha_usuario:document.getElementById('senha').value,
  };
  try{
    const r=await fetch('cadastrar.php',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
    const text=await r.text();
    out.textContent=`HTTP ${r.status}\n\n${text}`;
  }catch(err){out.textContent='ERRO DE REDE: '+err.message;}
});
</script>
</body>
</html>
